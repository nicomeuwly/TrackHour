<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Offline — TrackHour</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      min-height: 100svh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      background: #fff;
      color: #111;
    }
    main { max-width: 420px; text-align: center; }
    svg { margin-bottom: 1.5rem; opacity: 0.25; }
    h1 { font-size: 1.5rem; font-weight: 700; margin-bottom: 0.75rem; }
    p { color: #555; line-height: 1.6; margin-bottom: 1.5rem; }
    a {
      display: inline-block;
      padding: 0.6rem 1.5rem;
      border: 1px solid #111;
      border-radius: 0.5rem;
      font-weight: 600;
      text-decoration: none;
      color: #111;
    }
    a:hover { background: #111; color: #fff; }
    @media (prefers-color-scheme: dark) {
      body { background: #0a0a0a; color: #ededed; }
      p { color: #aaa; }
      a { border-color: #ededed; color: #ededed; }
      a:hover { background: #ededed; color: #0a0a0a; }
    }
  </style>
</head>
<body>
  <main>
    <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <line x1="1" y1="1" x2="23" y2="23"/>
      <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"/>
      <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"/>
      <path d="M10.71 5.05A16 16 0 0 1 22.56 9"/>
      <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"/>
      <path d="M8.53 16.11a6 6 0 0 1 6.95 0"/>
      <line x1="12" y1="20" x2="12.01" y2="20"/>
    </svg>
    <h1>You're offline</h1>
    <p>No internet connection right now.<br/>Your work hours data is still available locally — open the app once you're back online.</p>
    <a href="/">Try again</a>
  </main>
</body>
</html>
